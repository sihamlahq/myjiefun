name: Fix groom waist seam

on:
  push:
    branches:
      - replace-kisscam-couple-art

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-kisscam-couple-art
          fetch-depth: 1
      - name: Repair groom torso-to-trouser seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/kiss-cam/kiss-cam-puppet.tsx')
          s = p.read_text()
          old = '''              <div className="absolute inset-0 z-[1]">\n                <LayerImg src={`${base}/torso.png`} />\n              </div>'''
          new = '''              <div className="absolute inset-0 z-[1]">\n                <LayerImg src={`${base}/torso.png`} />\n                {/*\n                 * Seam correction for the photo-real groom artwork. The generated\n                 * torso and trouser masters meet at slightly different silhouettes\n                 * around the lower jacket/waist. A narrow duplicate of the lower\n                 * jacket is scaled only in its seam zone so the jacket overlaps the\n                 * trouser waistband cleanly without moving the shoulders or neck.\n                 */}\n                <div\n                  className="pointer-events-none absolute inset-0 overflow-visible"\n                  style={{ clipPath: "inset(35.5% 0 48.5% 0)" }}\n                  aria-hidden\n                >\n                  <LayerImg\n                    src={`${base}/torso.png`}\n                    style={{\n                      transformOrigin: `${pct(rig.hipPivot.x, "x")}% ${pct(rig.hipPivot.y, "y")}%`,\n                      transform: "scaleY(1.018)",\n                    }}\n                  />\n                </div>\n              </div>'''
          if old not in s:
              raise SystemExit('expected groom torso block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/kiss-cam/kiss-cam-puppet.tsx
          git diff --cached --quiet || git commit -m 'Repair groom jacket waist seam'
          git push origin HEAD:replace-kisscam-couple-art
