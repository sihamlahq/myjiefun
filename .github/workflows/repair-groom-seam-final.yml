name: Repair groom seam final

on:
  push:
    branches:
      - replace-kisscam-couple-art

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-kisscam-couple-art
          fetch-depth: 0
      - name: Restore complete known-good puppet
        shell: bash
        run: |
          set -e
          git checkout 4083c03381f61c98bf454537d465972813d30a0f -- src/components/kiss-cam/kiss-cam-puppet.tsx
          test "$(grep -c 'function BrideFigure' src/components/kiss-cam/kiss-cam-puppet.tsx)" -ge 1
          test "$(wc -l < src/components/kiss-cam/kiss-cam-puppet.tsx)" -gt 500
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/kiss-cam/kiss-cam-puppet.tsx
          git diff --cached --quiet || git commit -m 'Restore complete KissCam puppet implementation'
          git push origin HEAD:replace-kisscam-couple-art
