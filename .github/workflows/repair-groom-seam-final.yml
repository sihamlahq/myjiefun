name: Repair groom seam final

on:
  push:
    branches:
      - replace-kisscam-couple-art

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-kisscam-couple-art
          fetch-depth: 0
      - name: Patch groom waist seam deterministically
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/kiss-cam/kiss-cam-puppet.tsx')
          s = p.read_text()
          start = s.index('export function GroomFigure')
          end = s.index('export function BrideFigure')
          groom = s[start:end]

          old_legs = '<LayerImg src={`${base}/legs.png`} />'
          if old_legs not in groom:
              raise SystemExit('groom legs image not found')
          groom = groom.replace(
              old_legs,
              '''{/* Hide the trouser waistband behind the jacket hem. */}
                <LayerImg
                  src={`${base}/legs.png`}
                  style={{ clipPath: "inset(53% 0 0 0)" }}
                />''',
              1,
          )

          old_torso = '<LayerImg src={`${base}/torso.png`} />'
          if old_torso not in groom:
              raise SystemExit('groom torso image not found')
          groom = groom.replace(
              old_torso,
              '''<LayerImg src={`${base}/torso.png`} />
                {/* Extend the lower jacket over the trouser waistband so the generated-PNG join is hidden. */}
                <div
                  className="pointer-events-none absolute inset-0 overflow-visible"
                  style={{ clipPath: "inset(40% 0 38% 0)" }}
                  aria-hidden
                >
                  <LayerImg
                    src={`${base}/torso.png`}
                    style={{
                      transformOrigin: `${pct(rig.hipPivot.x, "x")}% ${pct(rig.hipPivot.y, "y")}%`,
                      transform: "translateY(1.2%) scaleY(1.015)",
                    }}
                  />
                </div>''',
              1,
          )

          s = s[:start] + groom + s[end:]
          p.write_text(s)
          PY

          grep -q 'clipPath: "inset(53% 0 0 0)"' src/components/kiss-cam/kiss-cam-puppet.tsx
          grep -q 'translateY(1.2%) scaleY(1.015)' src/components/kiss-cam/kiss-cam-puppet.tsx
          test "$(grep -c 'function BrideFigure' src/components/kiss-cam/kiss-cam-puppet.tsx)" -ge 1
          test "$(wc -l < src/components/kiss-cam/kiss-cam-puppet.tsx)" -gt 500

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/kiss-cam/kiss-cam-puppet.tsx
          git diff --cached --quiet || git commit -m 'Fix groom jacket trouser seam'
          git push origin HEAD:replace-kisscam-couple-art
