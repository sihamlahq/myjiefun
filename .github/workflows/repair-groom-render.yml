name: Repair groom render

on:
  push:
    branches:
      - replace-kisscam-couple-art

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-kisscam-couple-art
          fetch-depth: 0

      - name: Repair groom composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/kiss-cam/kiss-cam-puppet.tsx')
          s = p.read_text()

          # Remove the old generated black seam workaround completely.
          old_legs = '''<LayerImg
        src={`${base}/legs.png`}
        style={{ clipPath: "inset(53% 0 0 0)" }}
      />'''
          new_legs = '''<LayerImg src={`${base}/legs.png`} />'''
          if old_legs in s:
              s = s.replace(old_legs, new_legs, 1)

          old_torso = '''<LayerImg src={`${base}/torso.png`} />
      {/* Extend the lower jacket over the trouser waistband so the generated-PNG join is hidden. */}
      <div
        className="pointer-events-none absolute inset-0 overflow-visible"
        style={{ clipPath: "inset(40% 0 38% 0)" }}
        aria-hidden
      >
        <LayerImg
          src={`${base}/torso.png`}
          style={{
            transformOrigin: `${pct(rig.hipPivot.x, "x")}% ${pct(rig.hipPivot.y, "y")}%`,
            transform: "translateY(1.2%) scaleY(1.015)",
          }}
        />
      </div>'''
          new_torso = '''<LayerImg src={`${base}/torso.png`} />'''
          if old_torso not in s:
              raise SystemExit('old groom seam block not found')
          s = s.replace(old_torso, new_torso, 1)

          # Give the absolute figure a deterministic width.  Without an explicit
          # width, an absolute non-replaced div containing only absolute children
          # can resolve to a zero/shrink-to-fit width on some viewport layouts,
          # making the groom's full-canvas PNG layers effectively invisible.
          old_style = '''        height: "100%",
        width: "auto",
        left: `calc(50% + ${resolved.xPct}%)`,'''
          new_style = '''        height: "100%",
        width: "calc(100cqh * 0.5217391304)",
        aspectRatio: `${STAGE_W} / ${STAGE_H}`,
        left: `calc(50% + ${resolved.xPct}%)`,'''
          if old_style not in s:
              raise SystemExit('groom figure style anchor not found')
          s = s.replace(old_style, new_style, 1)

          # Keep the character wrapper's own aspect ratio explicit as well.
          old_inner = '''        className={cn("relative w-auto overflow-visible", FIGURE_HEIGHT_CLASS)}
        style={{ aspectRatio: `${STAGE_W} / ${STAGE_H}`, containerType: "size" }}'''
          new_inner = '''        className={cn("relative h-full overflow-visible", FIGURE_HEIGHT_CLASS)}
        style={{
          width: "100%",
          aspectRatio: `${STAGE_W} / ${STAGE_H}`,
          containerType: "size",
        }}'''
          if old_inner not in s:
              raise SystemExit('groom inner figure anchor not found')
          s = s.replace(old_inner, new_inner, 1)

          # Make sure the full bride implementation was not accidentally truncated.
          if 'export function BrideFigure' not in s:
              raise SystemExit('BrideFigure missing')
          if s.count('data-kiss-figure="groom"') != 1:
              raise SystemExit('unexpected groom figure count')
          if s.count('data-kiss-figure="bride"') != 1:
              raise SystemExit('unexpected bride figure count')

          p.write_text(s)
          PY

          # Remove obsolete one-shot repair workflows so they cannot mutate the
          # puppet again on later pushes.
          rm -f .github/workflows/fix-groom-waist-final.yml
          rm -f .github/workflows/remove-groom-seam-hack.yml

          grep -q 'width: "calc(100cqh \* 0.5217391304)"' src/components/kiss-cam/kiss-cam-puppet.tsx
          grep -q '<LayerImg src={`${base}/torso.png`} />' src/components/kiss-cam/kiss-cam-puppet.tsx
          grep -q '<LayerImg src={`${base}/legs.png`} />' src/components/kiss-cam/kiss-cam-puppet.tsx
          ! grep -q 'inset(40% 0 38% 0)' src/components/kiss-cam/kiss-cam-puppet.tsx
          ! grep -q 'inset(53% 0 0 0)' src/components/kiss-cam/kiss-cam-puppet.tsx

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/kiss-cam/kiss-cam-puppet.tsx .github/workflows/fix-groom-waist-final.yml .github/workflows/remove-groom-seam-hack.yml .github/workflows/repair-groom-render.yml
          git diff --cached --quiet || git commit -m 'Fix groom visibility and remove seam hacks'
          git push origin HEAD:replace-kisscam-couple-art
